server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: sky-server
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: ${hongs.datasource.driver-class-name}
    url: jdbc:mysql://${hongs.datasource.host}:${hongs.datasource.port}/${hongs.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${hongs.datasource.username}
    password: ${hongs.datasource.password}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      host: ${hongs.redis.host}
      port: ${hongs.redis.port}
      password: ${hongs.redis.password}

springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: 管理端接口
      paths-to-match: /admin/**
      packages-to-scan: com.hongs.skyserver.controller.admin
    - group: 用户端接口
      paths-to-match: /user/**
      packages-to-scan: com.hongs.skyserver.controller.user

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.hongs.skycommon.pojo.entity
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com:
      hongs:
        skyserver:
          controller: info
          service: info
          mapper: debug

sky:
  jwt:
    admin-secret-key: ${hongs.jwt.admin-secret-key}
    admin-ttl: ${hongs.jwt.admin-ttl}
    admin-token-name: ${hongs.jwt.admin-token-name}
    user-secret-key: ${hongs.jwt.user-secret-key}
    user-ttl: ${hongs.jwt.user-ttl}
    user-token-name: ${hongs.jwt.user-token-name}

  alioss:
    access-key-id: ${hongs.alioss.access-key-id}
    access-key-secret: ${hongs.alioss.access-key-secret}
    endpoint: ${hongs.alioss.endpoint}
    bucket-name: ${hongs.alioss.bucket-name}
    region: ${hongs.alioss.region}

  wechat:
    app-id: ${hongs.wechat.app-id}
    app-secret: ${hongs.wechat.app-secret}